name: Auto-setup fork sync
on:
  push:
    branches:
      - main
    paths:
      - sync-forks.py
      - gh_utils.py
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:

concurrency:
  group: auto-setup-forks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Add sync workflow to new forks
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: python sync-forks.py --add-workflow
